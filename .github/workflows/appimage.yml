# Builds the AppImage (the launcher, the port and their whole Nix closure: one file a player
# downloads, runs, and points at their own game folder). A tag v* publishes it as a release with
# SHA256SUMS; a manual run (Actions -> AppImage -> Run workflow) leaves it as an artifact.
name: AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# A newer run of the same ref replaces one still going.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Room for the Nix store (Mesa, GTK 4 and the build closure: ~10 GB of the runner's 14 GB
      # free). Removed in the background while the build runs: done in place it took 2 minutes.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
          df -h /

      # nixpkgs pinned: what the build compiles from source (Mesa with Vulkan only, GTK 4
      # without GStreamer, libadwaita: ~40 minutes) is then found in the cache below. On the
      # floating channel each of its updates rebuilt them all. Move the pin on purpose.
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/fe13242281a67641c0102cdb1087f0ebe586c7df.tar.gz
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The store between runs: Mesa, GTK and the rest are built once.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Compilations reused from earlier runs (the LTO link still runs): the GPU library is
      # most of the build. Keyed by run, restored from the latest one.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-

      - name: Build
        env:
          WOC_CCACHE: 1
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: nix-shell --run 'ccache -z && bash build.sh && ccache -s'

      - name: Package
        run: nix-shell -p binutils --run 'bash packaging/appimage.sh'

      - name: Checksum
        run: cd dist && sha256sum Wipeport-x86_64.AppImage | tee Wipeport-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Wipeport-x86_64.AppImage
          path: |
            dist/Wipeport-x86_64.AppImage
            dist/Wipeport-x86_64.AppImage.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release.sh dist/Wipeport-x86_64.AppImage dist/Wipeport-x86_64.AppImage.sha256
